[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-of-extrapolation"
version = "0.1.0"
description = "Dynamic promotion planning under demand displacement and empirical action support"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jan Zasadil"}]
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=16,<26",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2,<5",
    "nbformat>=5.10,<6",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

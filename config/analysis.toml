# Frozen empirical design used by the active notebooks.

[policy]
decision_horizon = 12
washout_horizons = [0, 4, 6, 8, 10, 12]
cooldown_weeks = 2
maximum_promotions_per_product = 4
discount_factor = 0.995
main_contract_generosity = 2.24
contract_grid_start = 1.40
contract_grid_stop = 3.20
contract_grid_step = 0.05
weekly_capacities = [1, 2, 3, 8]

economic_profile = "weekly_predicted_demand_fixed_product_price_cost"

[support]
bin_width = 0.05
minimum_depth = 0.03
maximum_depth = 0.60
minimum_observations = 15
minimum_panels = 3
maximum_positive_actions = 3
matching_tolerance = 0.03

[washout_selection]
vdo_stability_tolerance = 0.05
terminal_state_tolerance = 0.01

[boundary_validation]
capacity = 2
alpha_start = 2.40
alpha_stop = 2.65
alpha_step = 0.01
